<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>梦幻小西游 · 桃源村</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#1b1410;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none;
    width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;
    box-shadow:0 0 40px rgba(0,0,0,.6);cursor:pointer;}
  #tip{display:none;position:fixed;left:0;right:0;bottom:24px;text-align:center;color:#e8d3a0;font:15px sans-serif;pointer-events:none;}
  @media (orientation:portrait){#tip{display:block;}}
</style>
</head>
<body>
<div id="tip">📱 把手机横过来玩，画面更大哦</div>
<canvas id="game" width="1280" height="720"></canvas>
<script src="js/art.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
</body>
</html>
